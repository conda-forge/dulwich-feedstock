schema_version: 1

context:
  version: "1.2.16"

package:
  name: dulwich
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/d/dulwich/dulwich-${{ version }}.tar.gz
  sha256: b2ffec357a58647b593e39d10efad314ad8f3588c39045ab1707f16ec47e0063

build:
  number: 0
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - dulwich = dulwich.cli:main

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib("c") }}
    - cargo-bundle-licenses
  host:
    - python
    - setuptools >=77.0.0
    - setuptools-rust
    - pip
  run:
    - python
    - urllib3 >=2.2.2
    - if: match(python, ">=3.12")
      then: setuptools
    - if: match(python, "<=3.11")
      then: typing_extensions >=4.6.0

tests:
  - python:
      imports:
        - dulwich
        - dulwich.tests
        - dulwich.archive
        - dulwich.client
        - dulwich.config
        - dulwich.diff_tree
        - dulwich.errors
        - dulwich.file
        - dulwich.hooks
        - dulwich.ignore
        - dulwich.index
        - dulwich.object_store
        - dulwich.objects
        - dulwich.objectspec
        - dulwich.pack
        - dulwich.patch
        - dulwich.protocol
        - dulwich.reflog
        - dulwich.refs
        - dulwich.repo
        - dulwich.server
        - dulwich.walk
        - dulwich.web
        # compiled extensions
        - dulwich._diff_tree
        - dulwich._objects
        - dulwich._pack
      pip_check: true
  - script:
      - dulwich help --all
  # riscv64, py3.15+: missing dependencies
  # win: hang, also missing dependencies at least on arm64
  - if: not (riscv64 or match(python, ">=3.15") or win)
    then:
      - requirements:
          run:
            - fastimport
            - if: unix
              then:
                - gnupg
                - openssh
              else:
                - m2-gnupg
            # - gpgmepy
            - hypothesis
            - merge3
            - if: not win-arm64
              then: paramiko
        files:
          source:
            # test get confused if dulwich isn't located related to PWD
            - dulwich/
            - docs/
            - testdata/
            - tests/
        script:
          - if: linux
            then:
              - mkdir tmp
              - TMPDIR=${PWD}/tmp python -m unittest -v tests.test_suite
            else: python -m unittest -v tests.test_suite

about:
  license: Apache-2.0
  license_file:
    - COPYING
    - THIRDPARTY.yml
  summary: Python Git Library
  description: |
    Python implementation of the Git file formats and protocols, without the need to have git installed.
    All functionality is available in pure Python. Optional C extensions can be built for improved performance.
    The project is named after the part of London that Mr. and Mrs. Git live in in the particular Monty Python sketch.
  homepage: https://www.dulwich.io/
  repository: https://github.com/jelmer/dulwich
  documentation: https://www.dulwich.io/docs/

extra:
  recipe-maintainers:
    - mikofski
    - xylar
    - mgorny
